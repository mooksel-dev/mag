<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7b8bff"/>
      <stop offset="1" stop-color="#4a5ae0"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity=".28"/>
    </filter>
  </defs>
  <!-- macOS icon grid: 824 tile on a 1024 canvas, transparent outside the tile -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)" filter="url(#shadow)"/>
  <!-- the mark (viewBox 0 0 44 44), centered on its optical center -->
  <g transform="translate(512 512) scale(13) translate(-22.5 -22)">
    <g fill="none" stroke-width="4" stroke-linecap="round">
      <path d="M36 9H22a13 13 0 0 0 0 26h14" stroke="#ffffff"/>
      <path d="M36 16H22a6 6 0 0 0 0 12h14" stroke="rgba(255,255,255,.72)"/>
    </g>
    <circle cx="25" cy="22" r="2.5" fill="rgba(255,255,255,.5)"/>
  </g>
</svg>
